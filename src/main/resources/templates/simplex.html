<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programação Linear - Simplex</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-zinc-50 text-zinc-900 antialiased min-h-screen flex flex-col">
<header class="top-0 bg-zinc-900 text-zinc-50 p-8 shadow-lg">
    <div class="max-w-4xl mx-auto text-center">
        <h1 class="text-3xl md:text-4xl font-extrabold mb-3 tracking-tight">
            Pesquisa Operacional
        </h1>
        <p class="text-md max-w-2xl mx-auto font-light">
            API para resolução de problemas de otimização matemática focada em Programação Linear e Modelos de Transporte.
        </p>
    </div>
</header>

<main class="flex-1 flex flex-col items-center w-full mx-auto p-8">
        <form th:action="@{/simplex/calculate}" th:object="${simplexProblem}" method="post" class="w-full">
            <h2 class="text-2xl font-bold text-center text-zinc-900">Algoritmo Simplex</h2>

            <div class="flex justify-center my-6 max-w-sm mx-auto bg-white rounded-2xl p-6 shadow-sm border border-zinc-200">
                <div class="w-full">
                    <div class="flex justify-between items-center">
                        <label for="coefficient-count" class="text-md font-medium">N.º Variáveis:</label>
                        <input type="number" id="coefficient-count" class="w-8 p-1 border-b-2 focus:outline-none focus:border-zinc-500 text-md text-right" min="0" placeholder="0" oninput="addField()" />
                    </div>
                    <div class="mt-2 flex justify-between items-center">
                        <label for="constraint-count" class="text-md font-medium">N.º Restrições:</label>
                        <input type="number" id="constraint-count" class="w-8 p-1 border-b-2 focus:outline-none focus:border-zinc-500 text-md text-right" min="0" placeholder="0" oninput="addField()" />
                    </div>
                </div>
            </div>

            <hr>

            <div class="flex justify-center my-6">
                <div class="w-full">
                    <h3 class="text-md font-bold text-center text-zinc-900">Função Objetivo</h3>

                    <div class="mt-2 flex justify-between items-center max-w-sm mx-auto">
                        <label for="optimizationType" class="text-md font-medium">Tipo de Otimização:</label>
                        <select id="optimizationType" class="p-1 border-b-2 bg-white focus:outline-none focus:border-zinc-500 text-md text-center" name="optimizationType" required>
                            <option value="" selected disabled>-- Selecione --</option>
                            <option value="MAXIMIZATION">Maximização</option>
                            <option value="MINIMIZATION">Minimização</option>
                        </select>
                    </div>
                    <div id="container-objective-function" class="max-w-5xl mx-auto"></div>
                </div>
            </div>

            <hr>

            <div class="flex justify-center">
                <div id="container-constraints" class="mt-4 max-w-5xl"></div>
            </div>

            <div class="flex justify-center gap-6 my-6">
                <button type="submit" class="bg-zinc-600 hover:bg-zinc-700 text-white font-medium py-3 px-4 rounded-xl transition-colors shadow-sm">Calcular</button>
                <div class="content-center">
                    <a href="http://localhost:8080/" class="text-zinc-700 hover:text-zinc-500 underline">Voltar</a>
                </div>

            </div>
        </form>

    </main>

    <footer class="bottom-0 bg-zinc-900 text-xs text-zinc-500 text-center p-6 mt-12">
        &copy; 2026 • Programação Linear - Todos os direitos reservados.
    </footer>
    </body>
</html>
